# Local development profile:  .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
# Never enable this profile in a deployed environment.

# Dev-only password so the app boots without exporting DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:postgrespassword}

# Registers POST /api/auth/dev-token so frontend/Postman can mint a JWT
# before the auth team's real login flow exists (see DevTokenController).
app.jwt.dev-token-endpoint-enabled=true
