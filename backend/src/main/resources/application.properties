spring.datasource.url=jdbc:postgresql://localhost:5432/shopstack_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate

# JWT. The auth team owns real issuance; override the secret via the environment.
# Must be at least 32 bytes: jjwt rejects shorter HMAC keys at startup.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-at-least-32-bytes-long}
app.jwt.expiry-ms=86400000

# CORS origins for the frontend dev server
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
